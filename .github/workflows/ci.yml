name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**", "feature/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  node:
    uses: discordy-voics/.github/.github/workflows/node.yml@main
    with:
      image-name: bots-sdk
      description: "@discordy-voics/bots: TypeScript SDK for Discordy bots (lint, typecheck, unit tests with a fake gateway and mocked REST)"
    secrets:
      private-deps-token: ${{ secrets.DEPS_TOKEN }}

  package:
    name: bots-sdk / build and docs
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Check that the packed tarball contains the build
        run: npm pack --dry-run --json | jq -e '.[0].files | map(.path) | index("dist/index.js") != null'
      - name: Check that the API reference is up to date
        run: |
          pnpm docs:api
          git diff --exit-code -- docs/api || { echo "::error::docs/api is stale: run 'pnpm docs:api' and commit"; exit 1; }
